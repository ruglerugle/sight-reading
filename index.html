<style>
:root {
  --bg: #f4efe6;
  --paper: #fffdf8;
  --ink: #2b2620;
  --muted: #7a6f62;
  --line: #e2d9ca;
  --accent: #3b5b8c;
  --accent-soft: #e3eaf5;
  --ok: #2e8b57;
  --ng: #c8433a;
  --hint: #d9a21b;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  line-height: 1.6;
}
header {
  max-width: 960px; margin: 0 auto; padding: 18px 16px 8px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; justify-content: space-between;
}
h1 { font-size: 1.5rem; margin: 0; letter-spacing: .05em; }
.midi-status {
  font-size: .85rem; padding: 4px 12px; border-radius: 999px;
  background: #eee6d8; color: var(--muted);
}
.midi-status.on { background: #dcefe3; color: var(--ok); }
.midi-status.off { background: #f6dfdc; color: var(--ng); }

main > * { min-width: 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.stage { display: grid; gap: 8px; justify-items: center; }
#staff { width: 100%; max-width: 560px; min-height: 160px; }
#staff svg { display: block; width: 100%; height: auto; }
.feedback { min-height: 2em; font-size: 1.15rem; font-weight: 700; text-align: center; }
.feedback.ok { color: var(--ok); }
.feedback.ng { color: var(--ng); }
.feedback .sub { font-weight: 500; color: var(--muted); font-size: .95rem; }
.name-hint { min-height: 1.5em; color: var(--hint); font-weight: 700; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
button {
  font: inherit; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: #fff;
  border-radius: 10px; padding: 6px 16px;
}
button.ghost { background: transparent; color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--hint); outline-offset: 2px; }

.field > span { color: var(--muted); }

.seg button { flex: 1; border: 0; border-radius: 0; background: transparent; color: var(--accent); padding: 4px 8px; }

}

.kb-nav-key { position: absolute; top: 0; }
.kb-nav-key.white { bottom: 0; border-right: 1px solid #ccc; }
.kb-nav-key.black { height: 60%; background: #444; }
.kb-nav-key.c::after { content: ""; position: absolute; left: 1px; bottom: 2px; width: 3px; height: 3px; border-radius: 50%; background: #999; }
.kb-nav-shade { position: absolute; top: 0; bottom: 0; background: rgba(43, 38, 32, .35); pointer-events: none; }

}

footer { text-align: center; font-size: .8rem; color: var(--muted); padding: 0 16px 24px; }
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  h1 { font-size: 1.25rem; }

<header>
  <h1>読譜トレーナー</h1>
  <div id="midiStatus" class="midi-status">MIDIを確認中…</div>

<main>
  <section class="card stage" aria-label="出題">
    <div id="stageBar" class="stage-bar" role="group" aria-label="ステージ"></div>
    <div id="stageInfo" class="stage-info" aria-live="polite"></div>
    <div id="result" class="result" aria-live="polite" hidden></div>
    <div id="staff" role="img" aria-label="出題された音符"></div>
    <div class="kb-wrap" aria-label="画面の鍵盤"><div id="kb" class="kb"></div></div>
    <div id="kbNav" class="kb-nav" role="scrollbar" aria-controls="kb" aria-label="鍵盤の全体図（ドラッグで左右に動かす）" hidden>
      <div id="kbNavKeys"></div>
      <div id="kbNavShadeL" class="kb-nav-shade" style="left:0"></div>
      <div id="kbNavShadeR" class="kb-nav-shade" style="right:0"></div>
      <div id="kbNavWin" class="kb-nav-win"></div>
    </div>
    <div id="nameHint" class="name-hint"></div>
    <div id="feedback" class="feedback" aria-live="polite"></div>

    </div>
    <div class="kb-note">MIDIがないときは、画面の鍵盤をクリックするか、PCのキー（A W S E D F T G Y H U J K＝ド〜ド、Z / X でオクターブを下げる / 上げる）で弾けます。</div>
  </section>

  <section class="card" aria-label="成績">
    <div class="stats">
      <div class="stat"><b id="stCount">0</b><span>正解した数</span></div>
      <div class="stat"><b id="stAcc">–</b><span>一発正解率</span></div>
      <div class="stat"><b id="stTime">–</b><span>平均反応時間</span></div>
      <div class="stat"><b id="stStreak">0</b><span>連続一発正解</span></div>
    </div>
    <div id="weak" class="weak"></div>
  </section>

  <section class="card settings" aria-label="設定">
    <h2>設定</h2>
    <div class="field">
      <span>音部記号</span>
      <div class="seg" id="clefSeg">
        <button type="button" data-v="treble">ト音</button>
        <button type="button" data-v="bass">ヘ音</button>
        <button type="button" data-v="grand">大譜表</button>
      </div>
    </div>
    <label class="field">
      <span>音域</span>
      <select id="rangeSel">
        <option value="1">譜表の中だけ</option>
        <option value="3">加線1本まで</option>
        <option value="5">加線2本まで</option>
        <option value="7">加線3本まで</option>
      </select>
    </label>
    <label class="field">
      <span>音名の表記</span>
      <select id="namingSel">
        <option value="ja">ドレミ</option>
        <option value="en">CDE</option>
      </select>
    </label>
    <label class="field">
      <span>鍵盤の動かし方（全体図）</span>
      <select id="navSel">
        <option value="keys">鍵盤をつかんで動かす</option>
        <option value="frame">枠をつかんで動かす</option>
      </select>
    </label>
    <div class="field">
      <span>出題</span>
      <label class="check"><input type="checkbox" id="accChk">♯・♭も出す</label>
      <label class="check"><input type="checkbox" id="octChk">オクターブ違いも正解にする</label>
      <label class="check"><input type="checkbox" id="hintChk">はじめから音名を見せる</label>
    </div>
    <div class="field">
      <span>記録</span>
      <button id="resetBtn" class="ghost" type="button">苦手の記録を消す</button>
    </div>
  </section>

</main>

<footer>MIDI入力は Chrome / Edge で使えます（Safari は非対応）。</footer>

<script>
'use strict';
const VF = Vex.Flow;

// ---- 音の表し方 ----
// step = オクターブ*7 + 音名番号（C4 = 28）。acc は -1/0/+1
const LETTERS = ['c', 'd', 'e', 'f', 'g', 'a', 'b'];
const LETTER_PC = [0, 2, 4, 5, 7, 9, 11];
const NAMES = {
  ja: ['ド', 'レ', 'ミ', 'ファ', 'ソ', 'ラ', 'シ'],
  en: ['C', 'D', 'E', 'F', 'G', 'A', 'B'],
};
const CLEF_BOTTOM = { treble: 30, bass: 18 }; // 第1線: E4 / G2
const SHARP_SPELL = [[0, 0], [0, 1], [1, 0], [1, 1], [2, 0], [3, 0], [3, 1], [4, 0], [4, 1], [5, 0], [5, 1], [6, 0]];
const FLAT_SPELL = [[0, 0], [1, -1], [1, 0], [2, -1], [2, 0], [3, 0], [4, -1], [4, 0], [5, -1], [5, 0], [6, -1], [6, 0]];

const stepToMidi = (step, acc) => (Math.floor(step / 7) + 1) * 12 + LETTER_PC[step % 7] + acc;

const midiToSpelling = (midi, preferFlat) => {
  const [li, acc] = (preferFlat ? FLAT_SPELL : SHARP_SPELL)[midi % 12];
  return { step: (Math.floor(midi / 12) - 1) * 7 + li, acc };
};

const noteLabel = (step, acc, naming) => {
  const name = NAMES[naming][step % 7] + (acc === 1 ? '♯' : acc === -1 ? '♭' : '');
  const sci = NAMES.en[step % 7] + (acc === 1 ? '♯' : acc === -1 ? '♭' : '') + Math.floor(step / 7);
  return naming === 'en' ? sci : `${name}（${sci}）`;
};

const vfKey = (step, acc) => `${LETTERS[step % 7]}${acc === 1 ? '#' : acc === -1 ? 'b' : ''}/${Math.floor(step / 7)}`;

// ---- 保存 ----
const STORE_KEY = 'sightReading_v1';
const loadStore = () => {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    console.warn('記録を読み込めませんでした', e);
    return {};
  }
};
const saveStore = (data) => {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn('記録を保存できませんでした', e);
  }
};

const stored = loadStore();
const settings = Object.assign(
  { clef: 'treble', ext: 3, naming: 'ja', acc: false, oct: false, hint: false, nav: 'keys' },
  stored.settings || {}
);
let noteStats = stored.noteStats || {}; // id -> { n, miss, time }
// mode: ステージ番号（1〜4）か 'free'。cleared: クリアした一番上のステージ
const progress = Object.assign({ mode: 1, cleared: 0 }, stored.progress || {});
const persist = () => saveStore({ settings, noteStats, progress });

// ---- ステージ ----
const STAGES = [
  { n: 1, name: '単音' },
  { n: 2, name: '2音' },
  { n: 3, name: '3音' },
  { n: 4, name: '4音' },
  // chord: 同時に押さえる。dyad=重音、triad=三和音（基本形）、inv=転回形も混ぜる
  { n: 2, name: '重音', chord: 'dyad' },
  { n: 3, name: '和音', chord: 'triad' },
  { n: 3, name: '転回形', chord: 'inv' },
];
const STAGE_Q = 20;      // 1ステージの問題数
const CLEAR_FIRST = 16;  // 一発正解がこの数以上（80%）
const CLEAR_SEC = 3;     // 1音あたりの平均時間がこの秒数以内
const CHORD_SEC = 4;     // 和音は1和音あたりの平均時間がこの秒数以内
const isUnlocked = (mode) => mode === 'free' || mode <= progress.cleared + 1;
const stageOf = () => (progress.mode === 'free' ? { n: 1, name: '自由練習' } : STAGES[progress.mode - 1]);
const noteCount = () => stageOf().n;
// 時間の基準：和音は1問を1単位、それ以外は1音を1単位として数える
const timeRule = () => (stageOf().chord ? { units: 1, label: '1和音', sec: CHORD_SEC } : { units: noteCount(), label: '1音', sec: CLEAR_SEC });

// ---- 出題 ----
const noteId = (q) => `${q.clef}|${q.step}|${q.acc}`;

const buildCandidates = () => {
  const clefs = settings.clef === 'grand' ? ['treble', 'bass'] : [settings.clef];
  const accs = settings.acc ? [0, 1, -1] : [0];
  return clefs.flatMap((clef) => {
    const bottom = CLEF_BOTTOM[clef];
    const steps = [];
    for (let s = bottom - settings.ext; s <= bottom + 8 + settings.ext; s++) steps.push(s);
    return steps.flatMap((step) =>
      accs
        // E♯・B♯・F♭・C♭ は出さない
        .filter((acc) => !(acc === 1 && (step % 7 === 2 || step % 7 === 6)) && !(acc === -1 && (step % 7 === 3 || step % 7 === 0)))
        .map((acc) => ({ clef, step, acc }))
    );
  });
};

// 間違えた音・遅い音ほど重くする
const weightOf = (q) => {
  const st = noteStats[noteId(q)];
  const base = q.acc === 0 ? 1 : 0.4;
  if (!st || st.n === 0) return base * 1.5;
  const missRate = (st.miss + 0.5) / (st.n + 1);
  const avgSec = st.time / Math.max(1, st.n - st.miss) / 1000;
  return base * (1 + missRate * 6 + Math.min(Math.max(avgSec - 1, 0), 3));
};

const pickNext = (prev) => {
  const cands = buildCandidates().filter((q) => !prev || noteId(q) !== noteId(prev));
  const weights = cands.map(weightOf);
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < cands.length; i++) {
    r -= weights[i];
    if (r <= 0) return cands[i];
  }
  return cands[cands.length - 1];
};

// ---- 和音 ----
const pcOf = (step, acc) => (LETTER_PC[step % 7] + acc + 12) % 12;
// step の位置で、音の高さ（ピッチクラス）が pc になる変化記号。♯・♭1つで書けなければ null
const spellAt = (step, pc) => {
  const d = (pc - LETTER_PC[step % 7] + 12) % 12;
  return d === 0 ? 0 : d === 1 ? 1 : d === 11 ? -1 : null;
};

const buildChord = (kind) => {
  const cands = buildCandidates();
  for (let tries = 0; tries < 200; tries++) {
    const root = pickNext(null);
    const rootPc = pcOf(root.step, root.acc);
    let notes;
    let quality = '';
    if (kind === 'dyad') {
      const iv = [2, 3, 4, 5][Math.floor(Math.random() * 4)]; // 3度・4度・5度・6度
      notes = [root, { clef: root.clef, step: root.step + iv, acc: 0 }];
    } else {
      // ♯・♭なしは白鍵だけの和音、ありは長三和音・短三和音
      const third = settings.acc ? (Math.random() < 0.5 ? 4 : 3) : null;
      const acc3 = third === null ? 0 : spellAt(root.step + 2, (rootPc + third) % 12);
      const acc5 = third === null ? 0 : spellAt(root.step + 4, (rootPc + 7) % 12);
      if (acc3 === null || acc5 === null) continue;
      notes = [root, { clef: root.clef, step: root.step + 2, acc: acc3 }, { clef: root.clef, step: root.step + 4, acc: acc5 }];
      const i3 = (pcOf(notes[1].step, acc3) - rootPc + 12) % 12;
      const i5 = (pcOf(notes[2].step, acc5) - rootPc + 12) % 12;
      quality = i3 === 4 ? (i5 === 8 ? 'aug' : '') : i5 === 6 ? 'dim' : 'm';
      // 転回形：下の音を1オクターブ上げる
      const inv = kind === 'inv' ? Math.floor(Math.random() * 3) : 0;
      for (let i = 0; i < inv; i++) notes[i] = { ...notes[i], step: notes[i].step + 7 };
      notes.sort((a, b) => a.step - b.step);
    }
    // 全部の音が出題範囲（同じ譜表）に入り、E♯・B♯・F♭・C♭ を含まないものだけ
    if (!notes.every((q) => cands.some((c) => c.clef === q.clef && c.step === q.step && c.acc === q.acc))) continue;
    const sym = (q) => NAMES.en[q.step % 7] + (q.acc === 1 ? '♯' : q.acc === -1 ? '♭' : '');
    const symbol = kind === 'dyad' ? '' : sym(root) + quality + (notes[0].step % 7 !== root.step % 7 ? `/${sym(notes[0])}` : '');
    return { notes, symbol };
  }
  return null;
};

// ---- 状態 ----
let current = null;   // { notes: [{ clef, step, acc }], pos: 次に弾く音の番号, chord?: 和音の記号, down?: 押さえている音 }
let played = null;    // 間違えた音 { clef, step, acc }（単音のときだけ譜面に出す）
let state = 'ask';    // ask | done | result
let shownAt = 0;      // 問題を出した時刻
let noteAt = 0;       // いま弾く音の番になった時刻
let misses = 0;       // この問題で間違えた回数
let noteMisses = 0;   // いま弾く音で間違えた回数
let nextTimer = 0;
const session = { correct: 0, firstTry: 0, asked: 0, time: 0, streak: 0 };
let stageRun = { done: 0, first: 0, time: 0 }; // ステージ中の成績（time は解答時間の合計）

const target = () => current.notes[current.pos];
const namesOf = (notes) => notes.map((q) => noteLabel(q.step, q.acc, settings.naming)).join('　');
const hintText = () => (settings.hint && current ? namesOf(current.notes) : '');

// ---- 譜面の描画 ----
const W = 300;
const $ = (id) => document.getElementById(id);

const render = (colorQ) => {
  const el = $('staff');
  el.innerHTML = '';
  const grand = settings.clef === 'grand';
  const reach = (settings.ext + 1) * 5 + 10; // 加線の音が譜表からはみ出す高さ
  const firstLine = reach + 4;
  const renderer = new VF.Renderer(el, VF.Renderer.Backends.SVG);
  const H = grand ? firstLine + 40 + reach * 2 + 50 + reach + 6 : firstLine + 40 + reach + 6;
  renderer.resize(W, H);
  const ctx = renderer.getContext();
  const x = grand ? 28 : 10;
  const staves = {};
  if (grand) {
    staves.treble = new VF.Stave(x, firstLine - 40, W - x - 10).addClef('treble');
    const bassFirst = firstLine + 40 + reach * 2 + 10;
    staves.bass = new VF.Stave(x, bassFirst - 40, W - x - 10).addClef('bass');
  } else {
    staves[settings.clef] = new VF.Stave(x, firstLine - 40, W - x - 10).addClef(settings.clef);
  }
  Object.values(staves).forEach((s) => s.setContext(ctx).draw());
  if (grand) {
    new VF.StaveConnector(staves.treble, staves.bass).setType('brace').setContext(ctx).draw();
    new VF.StaveConnector(staves.treble, staves.bass).setType('singleLeft').setContext(ctx).draw();
  }
  if (!current) return;

  const okColor = getComputedStyle(document.documentElement).getPropertyValue('--ok').trim();
  // slot: { clef, keys: [{ step, acc, color }], color }（和音は keys が複数）
  const slots = current.down
    ? [{
        clef: current.notes[0].clef,
        color: colorQ,
        keys: current.notes.map((q) => ({ ...q, color: [...current.down].some((m) => matches(m, q)) ? okColor : undefined })),
      }]
    : current.notes.map((q, i) => ({ clef: q.clef, keys: [q], color: colorQ || (i < current.pos ? okColor : undefined) }));
  if (played) slots.push({ clef: played.clef, keys: [played], color: getComputedStyle(document.documentElement).getPropertyValue('--ng').trim() });

  const makeNote = (slot) => {
    const n = new VF.StaveNote({ keys: slot.keys.map((k) => vfKey(k.step, k.acc)), duration: 'w', clef: slot.clef });
    slot.keys.forEach((k, i) => {
      const color = slot.color || k.color;
      if (k.acc) {
        const a = new VF.Accidental(k.acc === 1 ? '#' : 'b');
        if (color) a.setStyle({ fillStyle: color, strokeStyle: color });
        n.addModifier(a, i);
      }
      if (color) n.setKeyStyle(i, { fillStyle: color, strokeStyle: color });
    });
    if (slot.color) {
      n.setStyle({ fillStyle: slot.color, strokeStyle: slot.color });
      n.setLedgerLineStyle({ fillStyle: slot.color, strokeStyle: slot.color });
    }
    return n;
  };

  const center = x + (W - x - 10) / 2 + 10;
  // 単音は真ん中（間違えた音は右に並べる）、複数の音は音部記号の後ろから等間隔に並べる
  const multi = !current.down && current.notes.length > 1;
  const startX = multi ? Object.values(staves)[0].getNoteStartX() + 12 : 0;
  const spread = multi ? W - 20 - startX - 30 : slots.length === 1 ? 0 : 90;
  const voices = Object.entries(staves).map(([clef, stave]) => {
    stave.setNoteStartX(multi ? startX : center - spread / 2 - 10);
    const ticks = slots.map((q) => (q.clef === clef ? makeNote(q) : new VF.GhostNote({ duration: 'w' })));
    const voice = new VF.Voice({ num_beats: 4 * slots.length, beat_value: 4 }).setMode(VF.Voice.Mode.SOFT);
    voice.addTickables(ticks);
    return { voice, stave };
  });
  const fmt = new VF.Formatter();
  voices.forEach(({ voice }) => fmt.joinVoices([voice]));
  fmt.format(voices.map((v) => v.voice), spread + 1);
  voices.forEach(({ voice, stave }) => voice.draw(ctx, stave));

  const svg = el.querySelector('svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.removeAttribute('width');
  svg.removeAttribute('height');
  svg.style.width = '100%';
  svg.style.height = 'auto';
};

// ---- 画面の鍵盤 ----
const isBlack = (pc) => [1, 3, 6, 8, 10].includes(pc);
let kbRange = [48, 84];

const buildKeyboard = () => {
  const midis = buildCandidates().map((q) => stepToMidi(q.step, q.acc));
  const lo = Math.floor(Math.min(...midis) / 12) * 12;
  const hi = Math.ceil((Math.max(...midis) + 1) / 12) * 12;
  kbRange = [lo, hi];
  const kb = $('kb');
  kb.innerHTML = '';
  const whiteW = 26;
  let wi = 0;
  for (let m = lo; m <= hi; m++) {
    const key = document.createElement('div');
    key.dataset.midi = m;
    if (isBlack(m % 12)) {
      key.className = 'key black';
      key.style.left = `${wi * whiteW - 8}px`;
      key.style.width = '16px';
    } else {
      key.className = 'key white' + (m % 12 === 0 ? ' c-label' : '');
      key.dataset.label = `C${Math.floor(m / 12) - 1}`;
      key.style.left = `${wi * whiteW}px`;
      key.style.width = `${whiteW}px`;
      wi++;
    }
    key.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      beep(m);
      handleNote(m);
    });
    kb.appendChild(key);
  }
  kb.style.width = `${wi * whiteW}px`;
  // 下の全体図：同じ鍵盤を縮小して並べる
  const total = wi * whiteW;
  $('kbNavKeys').innerHTML = [...kb.children].map((k) => {
    const left = (parseFloat(k.style.left) / total) * 100;
    const width = (parseFloat(k.style.width) / total) * 100;
    const cls = k.classList.contains('black') ? 'black' : 'white' + (Number(k.dataset.midi) % 12 === 0 ? ' c' : '');
    return `<div class="kb-nav-key ${cls}" style="left:${left}%;width:${width}%"></div>`;
  }).join('');
  // はみ出すときは真ん中（中央ハ付近）を見せる
  setKbScroll(0.5);
};

// 鍵盤は指で動かさず、下の全体図をドラッグして左右に動かす（スワイプで打鍵してしまうのを防ぐ）
const kbOverflow = () => {
  const wrap = $('kb').parentElement;
  return Math.max(0, wrap.scrollWidth - wrap.clientWidth);
};
const setKbScroll = (ratio) => {
  const r = Math.min(1, Math.max(0, ratio));
  const over = kbOverflow();
  $('kb').parentElement.scrollLeft = r * over;
  const wrap = $('kb').parentElement;
  $('kbNav').hidden = over === 0;
  if (!over) return;
  const navW = $('kbNav').clientWidth;
  const winW = (wrap.clientWidth / wrap.scrollWidth) * navW;
  const viewL = (wrap.scrollLeft / wrap.scrollWidth) * navW;
  // keys: 枠は真ん中に固定し、縮小した鍵盤のほうをずらす / frame: 鍵盤は固定し、枠が動く
  const winL = settings.nav === 'frame' ? viewL : (navW - winW) / 2;
  Object.assign($('kbNavWin').style, { left: `${winL}px`, width: `${winW}px` });
  $('kbNavShadeL').style.width = `${winL}px`;
  $('kbNavShadeR').style.width = `${navW - winL - winW}px`;
  $('kbNavKeys').style.transform = `translateX(${winL - viewL}px)`;
};
const syncKbScroll = () => {
  const over = kbOverflow();
  setKbScroll(over ? $('kb').parentElement.scrollLeft / over : 0.5);
};
const showKey = (midi) => {
  const key = document.querySelector(`.key[data-midi="${midi}"]`);
  const over = kbOverflow();
  if (!key || !over) return;
  const wrap = key.parentElement.parentElement;
  const left = key.offsetLeft, right = left + key.offsetWidth;
  if (left >= wrap.scrollLeft && right <= wrap.scrollLeft + wrap.clientWidth) return;
  setKbScroll((left + key.offsetWidth / 2 - wrap.clientWidth / 2) / over);
};

const flashKey = (midi, cls, ms = 350) => {
  const key = document.querySelector(`.key[data-midi="${midi}"]`);
  if (!key) return;
  key.classList.add(cls);
  if (ms) setTimeout(() => key.classList.remove(cls), ms);
};
const clearHints = () => document.querySelectorAll('.key.hint').forEach((k) => k.classList.remove('hint'));

// ---- 音（画面の鍵盤・PCキー用）----
let audio = null; // { ctx, out, wave }
const getAudio = () => {
  if (audio) return audio;
  // iPhone のマナーモードでも鳴らす（Safari 16.4+）
  if (navigator.audioSession) navigator.audioSession.type = 'playback';
  const ctx = new AudioContext();
  const out = ctx.createDynamicsCompressor();
  out.connect(ctx.destination);
  // ピアノ風：倍音を少しずつ弱めた波形
  const amps = [0, 1, 0.55, 0.3, 0.18, 0.1, 0.06, 0.03];
  const wave = ctx.createPeriodicWave(new Float32Array(amps.length), Float32Array.from(amps));
  audio = { ctx, out, wave };
  return audio;
};

// Safari は pointerdown だけでは音声を有効にしないことがあるので、最初の操作で解放しておく
const unlockAudio = () => {
  try {
    const { ctx } = getAudio();
    if (ctx.state === 'suspended') ctx.resume();
  } catch (e) {
    console.warn('音声を有効にできませんでした', e);
  }
};
['touchstart', 'touchend', 'mousedown', 'keydown'].forEach((type) =>
  document.addEventListener(type, unlockAudio, { once: true, capture: true })
);

const beep = (midi) => {
  try {
    const { ctx, out, wave } = getAudio();
    if (ctx.state === 'suspended') ctx.resume();
    const t = ctx.currentTime;
    const freq = 440 * 2 ** ((midi - 69) / 12);
    const len = Math.min(2.5, Math.max(0.8, 2.5 - (midi - 48) / 30)); // 低い音ほど長く響く
    const osc = ctx.createOscillator();
    osc.setPeriodicWave(wave);
    osc.frequency.value = freq;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(Math.min(freq * 8, 12000), t);
    filter.frequency.exponentialRampToValueAtTime(Math.max(freq * 1.5, 300), t + len);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.6, t + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.2, t + 0.15);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + len);
    osc.connect(filter).connect(gain).connect(out);
    osc.start(t);
    osc.stop(t + len + 0.05);
  } catch (e) {
    console.warn('音を鳴らせませんでした', e);
  }
};

// ---- 進行 ----
const showName = (text) => { $('nameHint').textContent = text; };
const setFeedback = (cls, html) => {
  const fb = $('feedback');
  fb.className = 'feedback' + (cls ? ' ' + cls : '');
  fb.innerHTML = html;
};

const scheduleNext = (ms) => {
  clearTimeout(nextTimer);
  nextTimer = setTimeout(nextQuestion, ms);
};

const nextQuestion = () => {
  if (progress.mode !== 'free' && stageRun.done >= STAGE_Q) {
    showResult();
    return;
  }
  const kind = stageOf().chord;
  const chord = kind ? buildChord(kind) : null;
  if (chord) {
    current = { notes: chord.notes, pos: 0, chord: chord.symbol, down: new Set() };
  } else {
    // 和音が範囲に入らない設定（譜表の中だけ等）のときも、ここで単音の列にする
    let prev = current ? current.notes[current.notes.length - 1] : null;
    const notes = [];
    for (let i = 0; i < noteCount(); i++) {
      prev = pickNext(prev);
      notes.push(prev);
    }
    current = { notes, pos: 0 };
  }
  played = null;
  misses = 0;
  noteMisses = 0;
  state = 'ask';
  session.asked++;
  clearHints();
  render();
  showName(hintText());
  updateStageInfo();
  shownAt = noteAt = performance.now();
};

// 1問終わるごとにステージの成績を足す
const finishQuestion = (first, ms) => {
  if (progress.mode === 'free') return;
  stageRun.done++;
  if (first) stageRun.first++;
  stageRun.time += ms;
  updateStageInfo();
};

const record = (q, ok, ms) => {
  const id = noteId(q);
  const st = noteStats[id] || { n: 0, miss: 0, time: 0 };
  st.n++;
  if (!ok) st.miss++;
  else st.time += ms;
  noteStats[id] = st;
  persist();
};

const matches = (midi, q) => {
  const want = stepToMidi(q.step, q.acc);
  return settings.oct ? (midi - want) % 12 === 0 : midi === want;
};

// 1問ぜんぶ弾けたとき
const completeQuestion = (text) => {
  const ms = performance.now() - shownAt;
  state = 'done';
  session.correct++;
  if (misses === 0) {
    session.firstTry++;
    session.time += ms;
    session.streak++;
  } else {
    session.streak = 0;
  }
  finishQuestion(misses === 0, ms);
  render(getComputedStyle(document.documentElement).getPropertyValue('--ok').trim());
  setFeedback('ok', `○ ${text} <span class="sub">${(ms / 1000).toFixed(2)}秒</span>`);
  updateStats();
  scheduleNext(misses === 0 ? 450 : 900);
};

// 和音：MIDIは全部の音を同時に押さえたら正解、画面の鍵盤・PCキーは全部押したら正解（離した音は down から消えない）
const chordNoteOn = (midi) => {
  const idx = current.notes.findIndex((q) => matches(midi, q));
  if (idx < 0) {
    misses++;
    session.streak = 0;
    const sp = midiToSpelling(midi, current.notes.some((q) => q.acc === -1));
    flashKey(midi, 'ng');
    setFeedback('ng', `× 和音にない音 ${noteLabel(sp.step, sp.acc, settings.naming)}`);
    if (misses >= 2) {
      showName(namesOf(current.notes));
      current.notes.forEach((q) => flashKey(stepToMidi(q.step, q.acc), 'hint', 0));
      showKey(stepToMidi(current.notes[0].step, current.notes[0].acc));
    }
    updateStats();
    return;
  }
  current.down.add(midi);
  flashKey(midi, 'ok');
  if (current.notes.every((q) => [...current.down].some((m) => matches(m, q)))) {
    clearHints();
    current.pos = current.notes.length;
    completeQuestion(`${namesOf(current.notes)}${current.chord ? `（${current.chord}）` : ''}`);
    return;
  }
  render();
};

const noteOff = (midi) => {
  if (!current || !current.down || state !== 'ask') return;
  current.down.delete(midi);
  render();
};

const handleNote = (midi) => {
  if (!current || state !== 'ask') return;
  if (current.down) {
    chordNoteOn(midi);
    return;
  }
  const q = target();
  const multi = current.notes.length > 1;
  if (matches(midi, q)) {
    const now = performance.now();
    if (noteMisses === 0) record(q, true, now - noteAt);
    flashKey(midi, 'ok');
    clearHints();
    current.pos++;
    noteMisses = 0;
    noteAt = now;
    played = null;
    // 残りの音がある
    if (current.pos < current.notes.length) {
      render();
      showName(hintText());
      setFeedback('ok', `○ ${noteLabel(q.step, q.acc, settings.naming)}`);
      return;
    }
    completeQuestion(multi ? 'ぜんぶ正解' : noteLabel(q.step, q.acc, settings.naming));
    return;
  }
  if (noteMisses === 0) record(q, false, 0);
  misses++;
  noteMisses++;
  session.streak = 0;
  const sp = midiToSpelling(midi, q.acc === -1);
  if (!multi) played = { clef: settings.clef === 'grand' ? (midi >= 60 ? 'treble' : 'bass') : q.clef, ...sp };
  flashKey(midi, 'ng');
  render();
  setFeedback('ng', `× ${multi ? `${current.pos + 1}つ目の音で ` : ''}弾いた音は ${noteLabel(sp.step, sp.acc, settings.naming)}`);
  if (noteMisses >= 2) {
    showName(`${multi ? `${current.pos + 1}つ目は ` : ''}${noteLabel(q.step, q.acc, settings.naming)}`);
    showKey(stepToMidi(q.step, q.acc));
    flashKey(stepToMidi(q.step, q.acc), 'hint', 0);
  }
  updateStats();
};

const skip = () => {
  if (!current || state !== 'ask') return;
  if (!current.down && noteMisses === 0) record(target(), false, 0);
  session.streak = 0;
  state = 'done';
  finishQuestion(false, performance.now() - shownAt);
  const rest = current.down ? current.notes : [target()];
  showKey(stepToMidi(rest[0].step, rest[0].acc));
  rest.forEach((q) => flashKey(stepToMidi(q.step, q.acc), 'hint', 900));
  setFeedback('', `答えは ${namesOf(current.notes)}${current.chord ? `（${current.chord}）` : ''}`);
  render(getComputedStyle(document.documentElement).getPropertyValue('--hint').trim());
  updateStats();
  scheduleNext(current.notes.length > 1 ? 2000 : 1200);
};

// ---- ステージの進行 ----
const renderStageBar = () => {
  const modes = [...STAGES.map((_, i) => i + 1), 'free'];
  $('stageBar').innerHTML = modes.map((m) => {
    const label = m === 'free' ? '自由練習' : `${isUnlocked(m) ? '' : '🔒'}${STAGES[m - 1].name}`;
    return `<button type="button" data-mode="${m}" aria-pressed="${m === progress.mode}"${isUnlocked(m) ? '' : ' disabled'}>${label}</button>`;
  }).join('');
};

const updateStageInfo = () => {
  if (progress.mode === 'free') {
    $('stageInfo').innerHTML = '自由練習（単音・終わりなし）';
    return;
  }
  const rule = timeRule();
  const units = stageRun.done * rule.units;
  const per = units ? `${(stageRun.time / units / 1000).toFixed(1)}秒` : '–';
  $('stageInfo').innerHTML =
    `ステージ${progress.mode}　<b>${stageRun.done} / ${STAGE_Q}</b>問　一発正解 <b>${stageRun.first}</b>　${rule.label} <b>${per}</b>` +
    `<br>クリア: 一発正解${CLEAR_FIRST}問以上・${rule.label}平均${rule.sec}秒以内`;
};

const startStage = (mode) => {
  clearTimeout(nextTimer);
  // 答えている途中の問題は数えない
  if (current && state === 'ask') session.asked = Math.max(0, session.asked - 1);
  progress.mode = isUnlocked(mode) ? mode : progress.cleared + 1;
  persist();
  stageRun = { done: 0, first: 0, time: 0 };
  current = null;
  $('result').hidden = true;
  $('staff').hidden = false;
  $('skipBtn').hidden = false;
  renderStageBar();
  setFeedback('', stageOf().chord ? '和音の音をぜんぶ同時に押さえてください' : noteCount() > 1 ? '楽譜の音を左から順に弾いてください' : '楽譜の音を弾いてください');
  nextQuestion();
  updateStats();
};

const showResult = () => {
  state = 'result';
  const mode = progress.mode;
  const rule = timeRule();
  const per = stageRun.time / (STAGE_Q * rule.units) / 1000;
  const okFirst = stageRun.first >= CLEAR_FIRST;
  const okTime = per <= rule.sec;
  const clear = okFirst && okTime;
  if (clear && progress.cleared < mode) progress.cleared = mode;
  persist();
  const last = mode === STAGES.length;
  const mark = (ok) => (ok ? '<span class="pass">○ 達成</span>' : '<span class="miss">× あと少し</span>');
  const el = $('result');
  el.className = 'result ' + (clear ? 'clear' : 'fail');
  el.innerHTML =
    `<h2>${clear ? (last ? '全ステージクリア！' : `ステージ${mode} クリア！`) : `ステージ${mode} 失敗…`}</h2>` +
    `<p>一発正解 <b>${stageRun.first} / ${STAGE_Q}</b>問（${CLEAR_FIRST}問以上）${mark(okFirst)}</p>` +
    `<p>${rule.label}あたり平均 <b>${per.toFixed(1)}秒</b>（${rule.sec}秒以内）${mark(okTime)}</p>` +
    '<div class="controls">' +
    (clear && !last ? `<button type="button" data-go="${mode + 1}">次のステージへ（${STAGES[mode].name}）</button>` : '') +
    `<button type="button" class="${clear && !last ? 'ghost' : ''}" data-go="${mode}">もう一度</button>` +
    '</div>';
  el.hidden = false;
  $('staff').hidden = true;
  $('skipBtn').hidden = true;
  showName('');
  setFeedback('', '');
  clearHints();
  renderStageBar();
};

const updateStats = () => {
  $('stCount').textContent = session.correct;
  const answered = session.asked - (state === 'ask' && misses === 0 ? 1 : 0);
  $('stAcc').textContent = answered > 0 ? `${Math.round((session.firstTry / answered) * 100)}%` : '–';
  $('stTime').textContent = session.firstTry ? `${(session.time / session.firstTry / 1000).toFixed(2)}秒` : '–';
  $('stStreak').textContent = session.streak;

  const ids = new Set(buildCandidates().map(noteId));
  const weak = Object.entries(noteStats)
    .filter(([id, st]) => ids.has(id) && st.n >= 2 && st.miss > 0)
    .map(([id, st]) => ({ id, rate: st.miss / st.n }))
    .sort((a, b) => b.rate - a.rate)
    .slice(0, 5);
  $('weak').innerHTML = weak.length
    ? '苦手な音: ' + weak.map(({ id, rate }) => {
        const [clef, step, acc] = id.split('|');
        const clefName = settings.clef === 'grand' ? (clef === 'treble' ? 'ト音' : 'ヘ音') + ' ' : '';
        return `<strong>${clefName}${noteLabel(+step, +acc, settings.naming)}</strong>（${Math.round(rate * 100)}%ミス）`;
      }).join('、')
    : '';
};

// ---- 設定UI ----
const syncSettingsUI = () => {
  document.querySelectorAll('#clefSeg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === settings.clef)));
  $('rangeSel').value = String(settings.ext);
  $('namingSel').value = settings.naming;
  $('accChk').checked = settings.acc;
  $('octChk').checked = settings.oct;
  $('hintChk').checked = settings.hint;
  $('navSel').value = settings.nav;
};

const onSettingsChanged = () => {
  persist();
  syncSettingsUI();
  buildKeyboard();
  // 出題範囲が変わるので、ステージは最初からやり直す
  startStage(progress.mode);
};

document.querySelectorAll('#clefSeg button').forEach((b) =>
  b.addEventListener('click', () => { settings.clef = b.dataset.v; onSettingsChanged(); })
);
$('rangeSel').addEventListener('change', (e) => { settings.ext = Number(e.target.value); onSettingsChanged(); });
$('namingSel').addEventListener('change', (e) => { settings.naming = e.target.value; persist(); updateStats(); if (state === 'ask') showName(hintText()); });
$('accChk').addEventListener('change', (e) => { settings.acc = e.target.checked; onSettingsChanged(); });
$('octChk').addEventListener('change', (e) => { settings.oct = e.target.checked; persist(); });
$('navSel').addEventListener('change', (e) => { settings.nav = e.target.value; persist(); syncKbScroll(); });
$('hintChk').addEventListener('change', (e) => {
  settings.hint = e.target.checked;
  persist();
  if (state === 'ask') showName(hintText());
});
$('stageBar').addEventListener('click', (e) => {
  const b = e.target instanceof Element ? e.target.closest('button[data-mode]') : null;
  if (!b || b.disabled) return;
  startStage(b.dataset.mode === 'free' ? 'free' : Number(b.dataset.mode));
});
$('result').addEventListener('click', (e) => {
  const b = e.target instanceof Element ? e.target.closest('button[data-go]') : null;
  if (b) startStage(Number(b.dataset.go));
});
$('skipBtn').addEventListener('click', skip);
$('resetBtn').addEventListener('click', () => {
  if (!confirm('苦手な音の記録を消しますか？')) return;
  noteStats = {};
  persist();
  updateStats();
});

// ---- PCキーボード ----
const PC_KEYS = { a: 0, w: 1, s: 2, e: 3, d: 4, f: 5, t: 6, g: 7, y: 8, h: 9, u: 10, j: 11, k: 12 };
let pcOctave = 60;
document.addEventListener('keydown', (e) => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;
  const k = e.key.toLowerCase();
  if (k === 'z') { pcOctave = Math.max(kbRange[0], pcOctave - 12); return; }
  if (k === 'x') { pcOctave = Math.min(kbRange[1] - 12, pcOctave + 12); return; }
  if (k in PC_KEYS) {
    const m = pcOctave + PC_KEYS[k];
    beep(m);
    handleNote(m);
  }
});

// ---- MIDI ----
const setMidiStatus = (cls, text) => {
  const el = $('midiStatus');
  el.className = 'midi-status' + (cls ? ' ' + cls : '');
  el.textContent = text;
};

const onMidiMessage = (e) => {
  const [status, note, vel] = e.data;
  const type = status & 0xf0;
  if (type === 0x90 && vel > 0) handleNote(note);
  else if (type === 0x80 || type === 0x90) noteOff(note);
};

const initMidi = async () => {
  if (!navigator.requestMIDIAccess) {
    setMidiStatus('off', 'このブラウザはMIDIに対応していません');
    return;
  }
  try {
    const access = await navigator.requestMIDIAccess();
    const update = () => {
      const inputs = [...access.inputs.values()];
      inputs.forEach((i) => { i.onmidimessage = onMidiMessage; });
      if (inputs.length) setMidiStatus('on', `接続中: ${inputs.map((i) => i.name).join('、')}`);
      else setMidiStatus('off', 'MIDI機器が見つかりません（つなぐと自動で認識します）');
    };
    access.onstatechange = update;
    update();
  } catch (e) {
    setMidiStatus('off', e.name === 'NotAllowedError'
      ? 'MIDIが許可されていません。アドレスバー左のアイコン →「サイトの設定」→「MIDI デバイス」を「許可」にして再読み込みしてください'
      : `MIDIを使えません: ${e.message}`);
  }
};

// ---- 開始 ----
syncSettingsUI();
buildKeyboard();
startStage(progress.mode);
initMidi();
let navDrag = null; // { x: つかんだ位置, scroll: そのときの scrollLeft }
const navMove = (e) => {
  const wrap = $('kb').parentElement;
  // keys: 指と同じ向きに鍵盤が動く / frame: 指と同じ向きに枠が動く（鍵盤は逆向き）
  const dir = settings.nav === 'frame' ? -1 : 1;
  const scroll = navDrag.scroll - dir * (e.clientX - navDrag.x) * (wrap.scrollWidth / $('kbNav').clientWidth);
  setKbScroll(scroll / kbOverflow());
};
$('kbNav').addEventListener('pointerdown', (e) => {
  const wrap = $('kb').parentElement;
  const rect = $('kbNav').getBoundingClientRect();
  const winRect = $('kbNavWin').getBoundingClientRect();
  // 枠モードで枠の外を押したら、そこへ枠の中心を移してからつかむ
  if (settings.nav === 'frame' && (e.clientX < winRect.left || e.clientX > winRect.right)) {
    const center = ((e.clientX - rect.left) / rect.width) * wrap.scrollWidth;
    setKbScroll((center - wrap.clientWidth / 2) / kbOverflow());
  }
  navDrag = { x: e.clientX, scroll: wrap.scrollLeft };
  $('kbNav').setPointerCapture(e.pointerId);
  $('kbNav').classList.add('dragging');
  navMove(e);
});
$('kbNav').addEventListener('pointermove', (e) => { if (navDrag !== null) navMove(e); });
['pointerup', 'pointercancel'].forEach((type) =>
  $('kbNav').addEventListener(type, () => { navDrag = null; $('kbNav').classList.remove('dragging'); })
);
$('kb').parentElement.addEventListener('wheel', (e) => {
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.shiftKey ? e.deltaY : 0;
  const over = kbOverflow();
  if (!d || !over) return;
  e.preventDefault();
  setKbScroll(($('kb').parentElement.scrollLeft + d) / over);
}, { passive: false });
window.addEventListener('resize', () => { render(); syncKbScroll(); });
</script>
</body>
