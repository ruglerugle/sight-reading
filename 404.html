<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ページが見つかりません ― 読譜トレーナー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='12' cy='23' rx='7' ry='5' fill='%233b5b8c'/%3E%3Crect x='17' y='4' width='3' height='19' fill='%233b5b8c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #f4f3fb; --paper: #ffffff; --ink: #1e1b3a; --muted: #6b6890; --line: #e4e2f1; --accent: #5b4bdb; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--bg); color: var(--ink);
  font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
}
.card { max-width: 480px; width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; text-align: center; }
.code { font-size: 48px; font-weight: 700; color: var(--accent); margin: 0; letter-spacing: .05em; }
h1 { font-size: 20px; margin: 8px 0 12px; }
p { color: var(--muted); line-height: 1.8; margin: 0 0 24px; }
a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 999px; font-weight: 700; }
</style>
</head>
<body>
<main class="card">
  <img src="/img/chara/worried.svg" alt="" width="140" height="140" style="display:block;margin:0 auto 4px">
  <p class="code">404</p>
  <h1>この音符は、五線の外へ出てしまったようです。</h1>
  <p>お探しのページは見つかりませんでした。URLが変わったか、入力に誤りがあるかもしれません。</p>
  <a class="btn" href="/">読譜トレーナーのトップへ →</a>
</main>
</body>
</html>
